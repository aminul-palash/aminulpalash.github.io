  # About
  about:
    enable: true
    title: "About Me"
    image: "/images/myself.png"
    content: |-
      I am a **Senior AI Engineer** at BJIT Limited with over 5 years of experience in developing AI solutions and APIs using NLP and Machine Learning. Currently pursuing my **Masters in Data Science** at United International University while contributing to cutting-edge AI research.

      My expertise spans from building production-grade multi-agent systems to developing on-device Edge AI solutions. I'm passionate about recommendation systems, explainable AI, and bridging the gap between research and real-world applications.

      I have published multiple research papers in reputed venues including Springer and IEEE, focusing on areas like image captioning, text-to-image generation, and disease detection using deep learning.
    skills:
      enable: true
      title: "Core Technologies I work with:"
      items:
        - "Python"
        - "TensorFlow / PyTorch"
        - "LangChain / LangGraph"
        - "NLP & LLMs"
        - "FastAPI / Flask"
        - "Docker & Kubernetes"

